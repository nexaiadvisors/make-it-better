<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Version Review</title>
<style>
:root{--bg:#0f1214;--panel:#171b1f;--line:#2a3036;--text:#e9edf0;--muted:#98a3ad;--accent:#7dd56f;--warn:#f0b35a;--bad:#ef7d7d}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto 1fr;height:100vh}
button,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--muted)}button:disabled{opacity:.4;cursor:default}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:15px;margin:0 8px 0 0}#run{color:var(--muted);flex:1;min-width:180px}.tag{color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:0}
#stage{display:flex;justify-content:center;background:#050607;min-height:0;padding:10px}
iframe{width:100%;height:100%;border:0;background:#fff;border-radius:6px;transition:width .15s}
#stage.phone iframe{width:390px}
aside{border-left:1px solid var(--line);overflow:auto;background:var(--bg)}
.v{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:12px 14px}
.v[aria-current=true]{background:var(--panel);box-shadow:inset 3px 0 var(--accent)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.name{font-weight:650}.total{font-variant-numeric:tabular-nums;font-size:16px;font-weight:650}
.delta{color:var(--muted);font-size:12px}.up{color:var(--accent)}.down{color:var(--bad)}
.best{font-size:11px;color:#0f1214;background:var(--accent);border-radius:4px;padding:0 5px;margin-left:6px}
.sum{color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#detail{padding:14px;border-top:1px solid var(--line)}#detail h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:16px 0 5px}
#detail h2:first-child{margin-top:0}#detail p{margin:0 0 6px;white-space:pre-wrap;overflow-wrap:anywhere}
.dim{display:grid;grid-template-columns:96px 1fr 62px;gap:8px;align-items:center;margin:4px 0;font-size:12px}.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.files{color:var(--muted);font-size:12px;margin:0;padding-left:16px;overflow-wrap:anywhere}
@media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}aside{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header><h1>Site Version Review</h1><span id="run">Loading</span>
<label>Page <select id="page"></select></label>
<button id="desk" aria-pressed="true">Desktop</button><button id="phone" aria-pressed="false">Phone</button>
<button id="prev">Previous</button><button id="next">Next</button><a id="open" target="_blank" rel="noopener"><button>Open in new tab</button></a></header>
<main><div id="stage"><iframe id="frame" title="Selected site version" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe></div>
<aside><nav id="list" aria-label="Versions"></nav><section id="detail"></section></aside></main>
<script>
const $=id=>document.getElementById(id);let data=null,cur=0,page='/';
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
const label=v=>v.n===0?'Original':'Version '+v.n;
function url(){return `http://127.0.0.1:${data.versions[cur].port}${page}`}
function show(){const f=$('frame');if(f.dataset.u!==url()){f.dataset.u=url();f.src=url()}$('open').href=url();$('prev').disabled=cur===0;$('next').disabled=cur===data.versions.length-1;list();detail()}
function list(){const box=$('list');box.replaceChildren();data.versions.forEach((v,i)=>{const b=el('button','v');b.setAttribute('aria-current',i===cur);b.onclick=()=>{cur=i;show()};
const r=el('div','row'),n=el('span','name',label(v));if(v.best)n.append(el('span','best','Best'));const t=el('span');t.append(el('span','total',v.total));
if(v.delta!=null)t.append(el('span','delta '+(v.delta>0?'up':v.delta<0?'down':''),' '+(v.delta>0?'+':'')+v.delta));r.append(n,t);b.append(r,el('div','sum',v.summary||v.commit||'Summary pending'));box.append(b)})}
function section(t,body){const d=$('detail');d.append(el('h2',null,t));d.append(body)}
function detail(){const v=data.versions[cur],d=$('detail');d.replaceChildren();
section('What changed',el('p',null,v.summary||v.commit||'No summary was recorded for this pass.'));
section('Why',el('p',null,v.reason));
if(v.notes)section('Maker notes',el('p',null,v.notes));
if(v.commit&&v.summary)section('Commit '+v.sha,el('p',null,v.commit));
const s=el('div');Object.entries(v.dims).forEach(([k,o])=>{const r=el('div','dim');r.append(el('span',null,k));const b=el('div','bar'),i=el('i');i.style.width=(o.score/o.max*100)+'%';b.append(i);r.append(b,el('span',null,o.score+'/'+o.max));s.append(r)});section('Score '+v.total+' of 100',s);
if(v.files.length){const u=el('ul','files');v.files.forEach(f=>u.append(el('li',null,f)));section(v.stat,u)}
if(v.overflow.length)section('Layout overflow',el('p',null,v.overflow.join(', ')))}
function run(){const n=data.versions.length,b=data.versions.find(v=>v.best);$('run').textContent=`${n} version${n===1?'':'s'}. ${data.target?`Target ${data.target}. `:''}Best ${b?b.total:'-'}${data.reason&&data.reason!=='continue'?'. Stopped: '+data.reason.replaceAll('_',' '):''}`}
async function load(first){const r=await fetch('/api/versions');const d=await r.json();const was=data?data.versions.length:0;data=d;
if(first){$('page').replaceChildren(...d.pages.map(p=>{const o=el('option',null,p);o.value=p;return o}));page=d.pages[0];cur=d.versions.length-1}
run();if(first||d.versions.length!==was)show()}
$('page').onchange=e=>{page=e.target.value;show()};$('prev').onclick=()=>{cur--;show()};$('next').onclick=()=>{cur++;show()};
function width(ph){$('stage').classList.toggle('phone',ph);$('desk').setAttribute('aria-pressed',!ph);$('phone').setAttribute('aria-pressed',ph)}
$('desk').onclick=()=>width(false);$('phone').onclick=()=>width(true);
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||!data)return;if(e.key==='ArrowLeft'&&cur>0){cur--;show()}if(e.key==='ArrowRight'&&cur<data.versions.length-1){cur++;show()}});
load(true).catch(e=>$('run').textContent='Could not load versions: '+e.message);setInterval(()=>load(false).catch(()=>{}),15000);
</script></body></html>
